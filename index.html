<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Private</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#F4EFE6;color:#1C1A17;font:14px 'Hiragino Sans','Yu Gothic',system-ui,sans-serif}.box{width:min(390px,calc(100% - 32px));padding:34px;background:#FBF8F2;border:1px solid #CFC6B9;border-top:2px solid #7A1E2C;box-shadow:0 18px 48px #34271818}h1{font:400 26px 'Hiragino Mincho ProN','Yu Mincho',Didot,Georgia,serif;letter-spacing:.04em;margin:0 0 24px}input,button{width:100%;height:46px;background:#FBF8F2;color:#1C1A17;border:1px solid #817A70;border-radius:0;padding:0 12px;font:14px 'Hiragino Sans','Yu Gothic',system-ui,sans-serif}button{margin-top:12px;background:#7A1E2C;color:#fff;border-color:#7A1E2C;letter-spacing:.12em;cursor:pointer}button:hover{background:#59151f}#msg{min-height:20px;margin-top:12px;color:#7A1E2C;font-size:13px}</style></head><body><form class="box" id="form"><h1>ENTER PASSWORD</h1><input id="pw" type="password" autocomplete="current-password" required autofocus><button>UNLOCK</button><div id="msg" role="status"></div></form><script>'use strict';const form=document.getElementById('form'),pw=document.getElementById('pw'),msg=document.getElementById('msg');const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));async function unlock(password){msg.textContent='';try{const m=await(await fetch('manifest.json',{cache:'no-store'})).json();const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(m.salt),iterations:m.iter,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['decrypt']);const buf=new Uint8Array(await(await fetch('d/'+encodeURIComponent(m.file),{cache:'no-store'})).arrayBuffer());const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},key,buf.slice(12));const payload=JSON.parse(new TextDecoder().decode(clear));sessionStorage.setItem('sa-pw',password);const html=payload.app_html.replace('<script>','<script>window.__DATA__='+JSON.stringify(payload.data).replace(/</g,'\u003c')+';');document.open();document.write(html);document.close();return true}catch(e){sessionStorage.removeItem('sa-pw');msg.textContent='Wrong password.';pw.value='';pw.focus();return false}}form.addEventListener('submit',e=>{e.preventDefault();unlock(pw.value)});const saved=sessionStorage.getItem('sa-pw');if(saved)unlock(saved);</script></body></html>
